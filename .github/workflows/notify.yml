name: 댓글 알림
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: state
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 새 댓글 확인
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/check_comments.py
      - name: 상태 저장
        run: |
          git config user.name "stressbbang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet && exit 0
          git commit -q -m "state: $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
